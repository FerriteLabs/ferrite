# SDK Integration Test Suite
#
# Starts a Ferrite server and runs all SDK tests against it.
#
# Usage:
#   docker compose up -d
#   ./run-all.sh

services:
  ferrite:
    image: ferritelabs/ferrite:latest
    ports:
      - "6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 2s
      timeout: 2s
      retries: 15
