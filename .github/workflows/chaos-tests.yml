name: "Chaos & Stress Tests"

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual triggering

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: ferrite=info

# Cancel in-progress runs for the same workflow/ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit tests (sanity check) ──────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (sanity check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: chaos-unit

      - name: Run unit tests
        run: cargo test --lib
        timeout-minutes: 15

  # ── Chaos & stress tests (ignored tests) ───────────────────────────────────
  chaos-tests:
    name: Chaos & Stress Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: chaos-release

      - name: Build (release)
        run: cargo build --release
        timeout-minutes: 60

      - name: Run ignored chaos tests
        run: cargo test --test chaos_tests --release -- --ignored --test-threads=1
        timeout-minutes: 60

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-test-results
          path: |
            target/tmp/
            target/nextest/
          retention-days: 7
          if-no-files-found: ignore
