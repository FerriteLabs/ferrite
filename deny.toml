# cargo-deny configuration for Ferrite
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Include dev dependencies in vulnerability checks for supply-chain safety
exclude-dev = false

[advisories]
# The database of security advisories
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# cargo-audit reports unmaintained advisories as non-fatal warnings.
unmaintained = "none"
unsound = "workspace"
yanked = "warn"

# Ignore specific advisories (add rationale in comments)
# object_store 0.14 and Wasmtime 36 are public-type compatibility breaks.
# Keep the 0.4 API stable and resolve these in the next compatibility release.
ignore = [
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0096",
    "RUSTSEC-2026-0222",
    "RUSTSEC-2026-0020",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0021",
    "RUSTSEC-2026-0093",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2025-0046",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2025-0118",
    "RUSTSEC-2026-0091",
]

[licenses]
# Confidence threshold for license detection
confidence-threshold = 0.8

# List of allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
]

# Clarifications for specific crates
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# How to handle multiple versions of the same crate
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Crates to deny entirely
deny = [
    # Use rustls instead
    # { name = "openssl" },
]

# Crates that are allowed to have multiple versions
skip = [
    # Common crates with version fragmentation
    { name = "syn" },
    { name = "proc-macro2" },
    { name = "quote" },
    { name = "bitflags" },
    { name = "hashbrown" },
    { name = "indexmap" },
    { name = "logos" },       # Used by query parser token lookahead optimization
]

# Tree of allowed duplicate dependencies
skip-tree = []

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"

# Allowed registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Allowed git sources (none by default)
allow-git = []
