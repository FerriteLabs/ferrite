[package]
name = "ferrite-client"
version = "0.1.0"
edition = "2021"
description = "DEPRECATED: Use ferrite-rs instead. See ../ferrite-rs/"
license = "Apache-2.0"
repository = "https://github.com/ferritelabs/ferrite"
publish = false

[dependencies]
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
thiserror = "1"
